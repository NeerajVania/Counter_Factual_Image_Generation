accelerator: 'auto'
devices: 'auto'
max_epochs: 35
seed: null
training:
  out_dir: './out_rf'
  logfile: 'log.txt'
  criterion: 'velocity_mse'
  precision: 'bf16-mixed'
  objective: 'rectified_flow'
  checkpoints:
    save_top_k: 1
    monitor: 'val loss'
    mode: 'min'
    filename: '{epoch}'
data:
  name: 'EP'
  path_to_dataset: './data'
  csv_file: 'INSERTPATH'
  root_dir: 'INSERTPATH'
  use_imbalanced_sampler: True
  diffusion_transform: True
  encoder_transform: False
  batch_size: 16
  num_workers: 8
  image_resolution: 256
optimizer:
  name: 'AdamW'
  kwargs:
    lr: 5.0e-5
scheduler:
  name: null
  kwargs: {}
# Rectified Flow parameters (replaces noise_scheduler)
rectified_flow:
  # Number of Euler integration steps during inference
  num_inference_steps: 50
  # Scale for classifier-free guidance during sampling
  cfg_scale: 4.0
  # Timestep scale: continuous tau in [0,1] is mapped to tau * timestep_scale
  # for the sinusoidal timestep embedder (matching DDPM convention)
  timestep_scale: 999
  # CFG dropout probability during training (for both label and structure)
  cfg_dropout_prob: 0.1
# Kept for backward compatibility with existing time embedder
noise_scheduler:
  num_timesteps: 1000
  beta_start: 1e-4
  beta_end: 0.02
vae:
  checkpoint: 'model_weights/VAE/checkpoints/model.pt'
encoder:
  name: 'RETFound_dinov2_meh'
  checkpoint: null
model:  #https://github.com/facebookresearch/DiT/blob/main/models.py
  name: 'DiT'
  patch_size: 2
  in_channels: 4
  hidden_size: 1024
  depth: 24
  num_heads: 16
  mlp_ratio: 4.0
  # Correct field names matching code access patterns
  ordinal_input: False
  learned_ordinal_input: True
  use_structure: True
  # Velocity prediction: 4 output channels instead of 8
  learn_sigma: False
metrics: []
